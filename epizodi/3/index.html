<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>გავდივართ შრომის ინსპექციის მითითებებს · Safe Corner</title>
<meta name="description" content="ერთად გავდივართ შრომის ინსპექციის ყველაზე ხშირ მითითებებს და ვაჩვენებთ, რაში გვეხმარება Safety.ge.">
<meta property="og:title" content="გავდივართ შრომის ინსპექციის მითითებებს · Safe Corner">
<meta property="og:description" content="ერთად გავდივართ შრომის ინსპექციის ყველაზე ხშირ მითითებებს და ვაჩვენებთ, რაში გვეხმარება Safety.ge.">
<meta property="og:image" content="https://safecorner.ge/og.png">
<meta name="theme-color" content="#EEECE6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23EBA800'/%3E%3Cpath d='M28 44V28h16M56 28h16v16M72 56v16H56' fill='none' stroke='%230E0E0E' stroke-width='5'/%3E%3Cpath d='M28 56v16h18' fill='none' stroke='%230E0E0E' stroke-width='9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Noto+Sans+Georgian:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEECE6;--card:#F6F5F1;--ink:#0E0E0E;--ink2:#3A3A38;--muted:#6B6A66;--yellow:#EBA800;--line:#0E0E0E1f;--wide:"Archivo",sans-serif;--ka:"Noto Sans Georgian",sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ka),var(--wide);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:38px;height:38px}
.brand b{font-family:var(--wide);font-weight:800;font-stretch:125%;font-size:17px;white-space:nowrap}
.back{font-size:15px;color:var(--ink2);text-decoration:none;display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border:1.5px solid #0E0E0E33;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.back:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero{padding-top:64px;padding-bottom:40px;animation:up .7s var(--ease) both}
.eyebrow{font-family:var(--wide);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:4px;background:var(--yellow)}
h1{font-size:clamp(34px,4.6vw,56px);line-height:1.1;font-weight:800;margin:18px 0 14px}
.hero p{font-size:18px;color:var(--ink2);max-width:720px}
.hero{padding-bottom:32px}
.who{font-size:16px;color:var(--ink2);margin-top:-4px}
.player{position:relative;aspect-ratio:16/9;background:var(--ink);overflow:hidden;animation:up .7s var(--ease) .1s both}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pl-b{position:absolute;inset:0;border:0;padding:0;cursor:pointer;background:#000}
.pl-b img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.pl-b:hover img{transform:scale(1.03)}
.pl-b span{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;background:var(--yellow);display:grid;place-items:center;box-shadow:0 10px 30px #0000004d;transition:transform .3s}
.pl-b span svg{width:32px;height:32px;fill:var(--ink);margin-left:4px}
.pl-b:hover span{transform:scale(1.08)}
.soon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--bg);text-align:center;padding:24px}
.soon::before,.soon::after{content:"";position:absolute;width:70px;height:70px}
.soon::before{left:28px;bottom:28px;border-left:8px solid var(--yellow);border-bottom:8px solid var(--yellow)}
.soon::after{right:28px;top:28px;border-right:2px solid #EEECE680;border-top:2px solid #EEECE680}
.soon b{font-family:var(--wide);font-weight:900;font-stretch:125%;font-size:clamp(64px,11vw,140px);line-height:1;color:var(--yellow)}
.soon strong{font-size:clamp(18px,2.2vw,24px)}
.soon a{margin-top:6px;display:inline-flex;gap:8px;align-items:center;padding:11px 18px;background:var(--yellow);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;transition:transform .25s}
.soon a:hover{transform:translateY(-2px)}
.body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;padding:48px 0 24px}
.h{font-family:var(--wide);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.about p{font-size:18px;color:var(--ink2)}
.laws{border-top:2px solid var(--ink)}
.laws a{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .25s,padding .3s var(--ease)}
.laws a:hover{background:var(--card);padding-left:12px}
.laws b{display:block;font-size:15.5px;line-height:1.35}
.laws small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.laws em{font-style:normal;width:30px;height:30px;display:grid;place-items:center;border:1.5px solid #0E0E0E33;transition:background .3s,border-color .3s}
.laws a:hover em{background:var(--yellow);border-color:var(--yellow)}
.pn2{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:40px 0 96px}
.pn2 a{display:block;padding:20px 22px;background:var(--card);text-decoration:none;position:relative;transition:background .25s}
.pn2 a:hover{background:#fff}
.pn2 a small{display:block;font-family:var(--wide);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pn2 a b{font-size:16px;line-height:1.35}
.pn2 .nx{text-align:right}
footer{background:var(--bg);color:var(--muted);padding:26px 0;font-size:14px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--yellow)}
@media (max-width:900px){.body{grid-template-columns:minmax(0,1fr);gap:36px}}
@media (max-width:560px){.wrap{padding:0 16px}.brand b{font-size:15px}.back span{display:none}.back::after{content:"მთავარი"}.hero{padding-top:36px}.pn2{grid-template-columns:1fr}.soon::before,.soon::after{width:40px;height:40px}.soon::before{left:14px;bottom:14px;border-width:5px}.soon::after{right:14px;top:14px}.soon a{font-size:14px}.body{padding:36px 16px 8px}.pn2{padding:28px 16px 64px}.hero{padding-bottom:24px}}
.en{display:none}html[lang=en] .ka{display:none}html[lang=en] .en{display:revert}
.nr{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1.5px solid var(--ink);font-family:var(--wide);font-weight:700;font-size:13px}
.lang button{background:none;border:0;padding:6px 10px;cursor:pointer;color:var(--ink);font:inherit}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
@media (max-width:560px){.back::after{content:none!important}.back{padding:8px 11px}.nr{gap:8px}}
@media (max-width:420px){.brand b{display:none}}

</style>
</head>

<script>
(function(){
  function e(t){var d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML}
  function L(p){return p[1]&&p[1]!==p[0]?'<span class="ka">'+e(p[0])+'</span><span class="en">'+e(p[1])+'</span>':e(p[0])}
  var n=+document.body.dataset.ep,ep=SEASON.filter(function(x){return x.n===n})[0];if(!ep)return;
  var nn=(n<10?'0':'')+n,CH='https://www.youtube.com/@SafeCorner2024?sub_confirmation=1';
  document.getElementById('hero').innerHTML='<div class="eyebrow">'+L(['ეპიზოდი '+nn+' · '+ep.f[0],'Episode '+nn+' · '+ep.f[1]])+'</div><h1>'+L(ep.t)+'</h1>'+(ep.who[0]?'<p class="who">'+L(ep.who)+'</p>':'');
  var pl=document.getElementById('player');
  if(ep.yt){pl.innerHTML='<button class="pl-b" type="button" aria-label="Play"><img src="https://i.ytimg.com/vi/'+e(ep.yt)+'/maxresdefault.jpg" alt="" onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/'+e(ep.yt)+'/hqdefault.jpg\'"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></button>';
    pl.querySelector('button').onclick=function(){pl.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(ep.yt)+'?autoplay=1&rel=0" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>'}}
  else pl.innerHTML='<div class="soon"><b>'+nn+'</b><strong>'+L(['პრემიერა მალე','Premiere coming soon'])+'</strong><a href="'+CH+'" target="_blank" rel="noopener">'+L(['გამოიწერე YouTube-ზე ↗','Subscribe on YouTube ↗'])+'</a></div>';
  document.getElementById('about').innerHTML=L(ep.d);
  var ds=ep.docs.map(function(k){return DOCS.filter(function(d){return String(d.id||d.key)===String(k)})[0]}).filter(function(d){return d&&d.pdf});
  document.getElementById('laws').innerHTML=ds.map(function(d){return '<a href="/kanonmdebloba/doc.html?id='+e(d.id||d.key)+'"><span><b>'+L([d.t,d.te])+'</b><small>'+L([d.ty,d.tye])+(d.n?' · №'+e(d.n):'')+'</small></span><em>→</em></a>'}).join('');
  var pv=SEASON.filter(function(x){return x.n===n-1})[0],nx=SEASON.filter(function(x){return x.n===n+1})[0];
  function c(x,cl,lab){var k=(x.n<10?'0':'')+x.n;return '<a class="'+cl+'" href="/epizodi/'+x.n+'/"><small>'+L(lab)+' · '+k+'</small><b>'+L(x.t)+'</b></a>'}
  document.getElementById('pn').innerHTML=(pv?c(pv,'pv',['← წინა','← Previous']):'<span></span>')+(nx?c(nx,'nx',['შემდეგი →','Next →']):'');
  function tt(){document.title=(document.documentElement.lang==='en'?ep.t[1]:ep.t[0])+' · Safe Corner'}tt();document.addEventListener('sc-lang',tt);
})();
</script>
