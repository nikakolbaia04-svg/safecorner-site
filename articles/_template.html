<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>სტატიის სათაური · Safe Corner</title>
<meta name="description" content="სტატიის მოკლე აღწერა">
<meta name="theme-color" content="#EEECE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Noto+Sans+Georgian:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEECE6;--ink:#0E0E0E;--ink2:#3A3A38;--muted:#6B6A66;--yellow:#EBA800;--line:#0E0E0E1f;--wide:"Archivo",sans-serif;--ka:"Noto Sans Georgian",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ka),var(--wide);font-size:18px;line-height:1.75}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left,0px))}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:68px;max-width:1180px}
.brand{font-family:var(--wide);font-weight:800;font-stretch:125%;text-decoration:none;font-size:16px}
.back{font-size:15px;color:var(--ink2);text-decoration:none}
article{padding:72px 0 96px}
.cat{font-family:var(--wide);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;gap:12px;align-items:center}
.cat::before{content:"";width:28px;height:4px;background:var(--yellow)}
h1{font-size:clamp(30px,5vw,46px);line-height:1.2;margin:18px 0 22px;text-wrap:balance}
.meta{display:flex;gap:16px;align-items:center;padding:18px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:40px;font-size:15px;color:var(--muted)}
.meta b{color:var(--ink)}
.body h2{font-size:26px;line-height:1.3;margin:44px 0 14px}
.body p{color:var(--ink2);margin-bottom:20px}
.body ul,.body ol{margin:0 0 20px 24px;color:var(--ink2)}
.body blockquote{border-left:4px solid var(--yellow);padding:4px 0 4px 22px;margin:28px 0;font-weight:600;color:var(--ink)}
.author{margin-top:56px;background:#F6F5F1;padding:28px;position:relative}
.author::after{content:"";position:absolute;left:0;bottom:0;width:44px;height:44px;border-left:6px solid var(--yellow);border-bottom:6px solid var(--yellow)}
.author h3{font-size:19px}
.author p{color:var(--ink2);font-size:15px;margin-top:6px}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">SAFE CORNER</a><a class="back" href="/#articles">← ყველა სტატია</a></div></header>
<main class="wrap">
  <article>
    <div class="cat">კატეგორია</div>
    <h1>სტატიის სათაური</h1>
    <div class="meta"><span>ავტორი: <b>სახელი გვარი</b></span><span>2026-11-20</span></div>
    <div class="body">
      <p>სტატიის ტექსტი.</p>
    </div>
    <div class="author">
      <h3>სახელი გვარი</h3>
      <p>ავტორის მოკლე ბიო.</p>
    </div>
  </article>
</main>
</body>
</html>
